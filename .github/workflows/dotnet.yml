# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x
    - name: Connect to GitHub Packages
      run: dotnet nuget add source --username Actions --password ${{ secrets.GITHUB_TOKEN }} --store-password-in-clear-text --name github "https://nuget.pkg.github.com/CryonixInteractive/index.json"
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore -c Release
    - name: Packclea
      run: dotnet pack -c Release
    - name: Test
      run: dotnet test --no-build --verbosity normal
    - name: Upload a Build Artifact
      uses: actions/upload-artifact@v7.0.1
      with:    
        path: bin/Release/net10.0/CryonixVnFormat.dll
        if-no-files-found: error
        overwrite: true
        archive: false
    - name: Upload to GitHub Packages
      run: dotnet nuget push "bin/Release/CryonixVnFormat.1.0.0.nupkg" --api-key ${{ secrets.GITHUB_TOKEN }} --source "github"

